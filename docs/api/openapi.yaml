openapi: 3.1.0

info:
  title: Cobre Notifications — client APIs
  version: "1.0.0"
  description: |
    Two client-facing APIs.

    **Self-service** (port 3002) — query and replay notification events.
    **Subscriptions** (port 3001) — register where events should be delivered.

    Every endpoint requires a bearer token, and the client identity is taken
    from the token's `sub` claim. No endpoint accepts a `client_id` parameter:
    that is the access-control model, not an omission.

    A resource belonging to another client answers `404`, never `403` — a 403
    confirms the resource exists, which turns the endpoint into an enumeration
    oracle.

servers:
  - url: http://localhost:3002
    description: Self-service API
  - url: http://localhost:3001
    description: Subscription API

security:
  - bearerAuth: []

tags:
  - name: Notification events
  - name: Subscriptions
  - name: Demo

paths:
  /notification_events:
    get:
      tags: [Notification events]
      summary: List the caller's notification events
      description: |
        Filterable by creation date and delivery status, as the case statement
        requires. `delivery_status` is accepted as an alias for `state`.

        Always scoped to the authenticated client.
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/EventState' }
        - name: delivery_status
          in: query
          description: Alias for `state`.
          schema: { $ref: '#/components/schemas/EventState' }
        - name: created_from
          in: query
          schema: { type: string, format: date-time }
          example: "2024-03-15T00:00:00Z"
        - name: created_to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: Capped so one request cannot pull the whole table.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification_events:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationEventSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notification_events/{notification_event_id}:
    get:
      tags: [Notification events]
      summary: One event with its full delivery history
      parameters:
        - name: notification_event_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The event and every delivery attempt made for it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationEventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            Not found — or belongs to another client. The two are deliberately
            indistinguishable.

  /notification_events/{notification_event_id}/replay:
    post:
      tags: [Notification events]
      summary: Re-send a notification whose delivery definitively failed
      description: |
        Only an event in state `FAILED` can be replayed. Any other state
        answers `409` with an explanation.

        The replay publishes the original payload back onto the same topic a
        first delivery arrives on, tagged `dispatch_source = SELF_SERVICE`.
        Delivery is therefore asynchronous: this returns `202`, and the outcome
        appears as a new attempt on the event.

        No request body — the client identity comes from the token.
      parameters:
        - name: notification_event_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Replay accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification_event_id: { type: string, format: uuid }
                  client_id: { type: string }
                  state: { type: string, const: RETRYING }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found, or belongs to another client }
        '409':
          description: The event is not in a replayable state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: event_not_replayable
                message: This notification was delivered successfully and will not be sent again.
        '501':
          description: The deployment is running against a read-only event source

  /subscriptions:
    post:
      tags: [Subscriptions]
      summary: Register a webhook for one or more event types
      description: |
        The webhook URL is validated before anything is written: HTTPS only, no
        credentials in the URL, no well-known service ports, and the host must
        not resolve into loopback, private, link-local, CGNAT or multicast
        space (OWASP A10).

        Each subscription is issued its own signing secret, **returned exactly
        once** in this response and never readable again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_url, events]
              additionalProperties: false
              properties:
                webhook_url: { type: string, format: uri, maxLength: 2048 }
                method:
                  type: string
                  enum: [POST, PUT, PATCH]
                  default: POST
                expected_status:
                  type: integer
                  minimum: 100
                  maximum: 599
                  default: 200
                  description: |
                    The status the client returns on success. Delivery is judged
                    against this, not against "any 2xx".
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, maxLength: 100 }
            example:
              webhook_url: https://client.example.com/hooks/payments
              method: POST
              expected_status: 201
              events: [credit_card_payment, debit_card_withdrawal]
      responses:
        '201':
          description: Created — `signing_secret` will not be shown again
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Subscription'
                        - type: object
                          properties:
                            signing_secret: { type: string }
                  note: { type: string }
        '400':
          description: Invalid request, or the webhook URL was refused
          content:
            application/json:
              example:
                error: webhook_url_rejected
                code: ADDRESS_BLOCKED
                message: webhook_url resolves to 169.254.169.254, which is link-local (cloud metadata)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: An active subscription already exists for that event type }

    get:
      tags: [Subscriptions]
      summary: List the caller's subscriptions
      description: Signing secrets are never included.
      responses:
        '200':
          description: The caller's subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /subscriptions/{id}:
    delete:
      tags: [Subscriptions]
      summary: Deactivate a subscription
      description: |
        Deactivated, not deleted. A delivery that failed last week must stay
        explainable next month, and its audit trail references this row.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deactivated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found, or belongs to another client }

  /auth/token:
    post:
      tags: [Demo]
      summary: Issue a token (demo only)
      description: |
        Mounted only when `ENABLE_DEMO_TOKENS=true`. A real deployment obtains
        tokens from the platform's identity provider; this endpoint exists so
        the demo is self-contained.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string }
      responses:
        '200':
          description: A bearer token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256, with the algorithm pinned and issuer and audience validated.
        The `sub` claim is the client identity and is the only source of it.

  responses:
    BadRequest:
      description: The request failed schema validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: unauthorized
            message: Invalid or expired token

  schemas:
    EventState:
      type: string
      enum: [PENDING, DELIVERING, RETRYING, DELIVERED, FAILED]
      description: |
        `PENDING` ingested · `DELIVERING` in flight · `RETRYING` awaiting another
        attempt · `DELIVERED` accepted by the client · `FAILED` retry budget
        spent, and the only state a client may replay from.

    DispatchSource:
      type: string
      enum: [SYSTEM, RETRY_SERVICE, SELF_SERVICE]
      description: |
        Why this attempt happened. All three travel the identical pipeline;
        this field exists so the audit trail can tell them apart.

    NotificationEventSummary:
      type: object
      properties:
        notification_event_id: { type: string, format: uuid }
        event_id:
          type: string
          description: The upstream platform's identifier, stored verbatim.
        client_id: { type: string }
        event_type: { type: string }
        state: { $ref: '#/components/schemas/EventState' }
        delivery_status:
          $ref: '#/components/schemas/EventState'
          description: Alias for `state`, in the case statement's vocabulary.
        retry_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationEventDetail:
      allOf:
        - $ref: '#/components/schemas/NotificationEventSummary'
        - type: object
          properties:
            event_payload:
              description: The original payload, exactly as the platform produced it.
            last_error: { type: [string, 'null'] }
            attempts:
              type: array
              items: { $ref: '#/components/schemas/NotificationAttempt' }

    NotificationAttempt:
      type: object
      properties:
        attempt_number: { type: integer }
        dispatch_source: { $ref: '#/components/schemas/DispatchSource' }
        status: { type: string, enum: [SUCCESS, FAILED] }
        webhook_url: { type: string }
        request_method: { type: string }
        request_payload: {}
        response_status: { type: [integer, 'null'] }
        response_body: {}
        error_message: { type: [string, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        attempted_at: { type: string, format: date-time }

    Subscription:
      type: object
      properties:
        subscription_id: { type: string, format: uuid }
        client_id: { type: string }
        event_type: { type: string }
        webhook_url: { type: string }
        http_method: { type: string }
        expected_status: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        code: { type: string }

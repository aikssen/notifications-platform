name: notifications-platform

# ---------------------------------------------------------------------------
# Infrastructure for the notifications platform.
#
# Kafka runs in KRaft mode (no ZooKeeper): fewer moving parts and a much
# faster, more reliable cold start — which matters when the whole thing is
# brought up live during a presentation.
#
# Application services are added to this file as each one is implemented.
# ---------------------------------------------------------------------------

services:

  postgres:
    image: postgres:16-alpine
    container_name: notif-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notifications} -d ${POSTGRES_DB:-notifications}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: notif-platform-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # --- KRaft: this node is both broker and controller -----------------
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- listeners: INTERNAL for containers, EXTERNAL for the host ------
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- single-node development settings -------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Creates topics explicitly. Auto-creation is disabled on purpose: partition
  # count is an architectural decision (ordering per client), not a default.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: notif-platform-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC_DISPATCH: ${KAFKA_TOPIC_DISPATCH:-notifications.dispatch}
      TOPIC_RESULT: ${KAFKA_TOPIC_RESULT:-notifications.delivery-result}
      TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-notifications.dlq}
      DISPATCH_PARTITIONS: ${KAFKA_DISPATCH_PARTITIONS:-3}

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: notif-platform-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h

  grafana:
    image: grafana/grafana:11.3.1
    container_name: notif-platform-grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # -------------------------------------------------------------------------
  # Application services
  # -------------------------------------------------------------------------

  subscription-service:
    build:
      context: ..
      dockerfile: services/subscription-service/Dockerfile
    container_name: notif-platform-subscriptions
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SUBSCRIPTION_SERVICE_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-notifications}:${POSTGRES_PASSWORD:-notifications}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
      SUBSCRIPTION_SERVICE_PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-notifications-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-notifications-api}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      # Demo only. A real deployment gets tokens from the platform's IdP.
      ENABLE_DEMO_TOKENS: "true"
      # The demo webhook is plain HTTP inside this network. Relaxing the guard
      # is an explicit, logged decision — see the warning both services emit.
      WEBHOOK_REQUIRE_HTTPS: ${WEBHOOK_REQUIRE_HTTPS:-false}
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dispatch-service:
    build:
      context: ../services/dispatch-service
    container_name: notif-platform-dispatch
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      subscription-service:
        condition: service_healthy
    ports:
      - "${DISPATCH_METRICS_PORT:-9101}:9101"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-notifications}:${POSTGRES_PASSWORD:-notifications}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_DISPATCH: ${KAFKA_TOPIC_DISPATCH:-notifications.dispatch}
      KAFKA_TOPIC_RESULT: ${KAFKA_TOPIC_RESULT:-notifications.delivery-result}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-notifications.dlq}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-notifications-dispatch}
      SUBSCRIPTIONS_BASE_URL: http://subscription-service:3001
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-5000}
      WEBHOOK_SYNC_MAX_ATTEMPTS: ${WEBHOOK_SYNC_MAX_ATTEMPTS:-3}
      WEBHOOK_SYNC_BASE_DELAY_MS: ${WEBHOOK_SYNC_BASE_DELAY_MS:-200}
      WEBHOOK_SYNC_MAX_DELAY_MS: ${WEBHOOK_SYNC_MAX_DELAY_MS:-2000}
      WEBHOOK_REQUIRE_HTTPS: ${WEBHOOK_REQUIRE_HTTPS:-false}
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-true}
      DISPATCH_METRICS_PORT: 9101
      LOG_LEVEL: ${LOG_LEVEL:-info}

  retry-service:
    build:
      context: ../services/retry-service
    container_name: notif-platform-retry
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${RETRY_METRICS_PORT:-9102}:9102"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-notifications}:${POSTGRES_PASSWORD:-notifications}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_DISPATCH: ${KAFKA_TOPIC_DISPATCH:-notifications.dispatch}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-notifications.dlq}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-5}
      RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-10}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-900}
      RETRY_POLL_INTERVAL_SECONDS: ${RETRY_POLL_INTERVAL_SECONDS:-5}
      RETRY_BATCH_SIZE: ${RETRY_BATCH_SIZE:-50}
      RETRY_VISIBILITY_SECONDS: ${RETRY_VISIBILITY_SECONDS:-60}
      RETRY_STALLED_AFTER_SECONDS: ${RETRY_STALLED_AFTER_SECONDS:-300}
      RETRY_METRICS_PORT: 9102
      LOG_LEVEL: ${LOG_LEVEL:-info}

  self-service-api:
    build:
      context: ..
      dockerfile: services/self-service-api/Dockerfile
    container_name: notif-platform-self-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${SELF_SERVICE_PORT:-3002}:3002"
    volumes:
      # The case statement's fixture, mounted rather than baked into the image
      # so there is exactly one copy of it in the repository.
      - ../fixtures:/fixtures:ro
    environment:
      FIXTURE_PATH: /fixtures/notification_events.json
      DATABASE_URL: postgres://${POSTGRES_USER:-notifications}:${POSTGRES_PASSWORD:-notifications}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_DISPATCH: ${KAFKA_TOPIC_DISPATCH:-notifications.dispatch}
      SELF_SERVICE_PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-notifications-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-notifications-api}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      ENABLE_DEMO_TOKENS: "true"
      # postgres | file — switching to `file` serves the case statement's
      # JSON fixture through the same port, with no other change.
      EVENTS_REPOSITORY: ${EVENTS_REPOSITORY:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  monitor-service:
    build:
      context: ..
      dockerfile: services/monitor-service/Dockerfile
    container_name: notif-platform-monitor
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${MONITOR_SERVICE_PORT:-3003}:3003"
    environment:
      MONITOR_SERVICE_PORT: 3003
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_RESULT: ${KAFKA_TOPIC_RESULT:-notifications.delivery-result}
      SELF_SERVICE_BASE_URL: http://self-service-api:3002
      LOG_LEVEL: ${LOG_LEVEL:-info}

  demo-tools:
    build:
      context: ..
      dockerfile: services/demo-tools/Dockerfile
    container_name: notif-platform-demo-tools
    restart: unless-stopped
    ports:
      - "${DEMO_TOOLS_PORT:-3004}:3004"
    environment:
      DEMO_TOOLS_PORT: 3004
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}

volumes:
  postgres_data:
  kafka_data:
